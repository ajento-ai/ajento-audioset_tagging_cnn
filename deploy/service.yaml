# Declarative alternative to deploy.sh:
#   gcloud run services replace deploy/service.yaml --region us-central1
# Replace PROJECT_ID before applying.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: audiotagging
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 2
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/audiotagging/audiotagging:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          env:
            - name: MODEL_TYPE
              value: Cnn14
            - name: MAX_UPLOAD_MB
              value: "100"
            - name: MAX_DURATION_SECONDS
              value: "600"
            - name: TORCH_NUM_THREADS
              value: "2"
          startupProbe:
            httpGet:
              path: /healthz
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
